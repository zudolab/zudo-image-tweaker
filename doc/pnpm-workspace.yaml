# Marks doc/ as its own pnpm workspace root. Without this, `pnpm -C doc
# install` walks up and attaches to the repo-root pnpm-workspace.yaml instead
# (doc/ isn't listed there), silently skipping doc/'s own install — no
# doc/node_modules, no doc/pnpm-lock.yaml, no error. This file stops that
# upward search so doc/ installs and locks independently.
packages: []

# pnpm 11 defaults minimumReleaseAge to 1440min; its exclude matcher can't
# match this project's peer-nested lockfile keys (upstream pnpm bug), and CI
# installs must be deterministic, so disable the gate (mirrors the repo root
# and the create-zudo-doc 8.1.0 template).
minimumReleaseAge: 0

# pnpm 11 fails CI installs with ERR_PNPM_IGNORED_BUILDS when a dependency's
# build script is not explicitly approved. esbuild (Go binary) comes from the
# zudo-doc toolchain; sharp (libvips bindings, via miniflare) and workerd
# (Cloudflare workers runtime binary) come from the pinned wrangler devDep.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
